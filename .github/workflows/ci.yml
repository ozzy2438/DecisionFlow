name: DecisionFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: decisionflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: Build backend test image
        run: docker compose build backend

      - name: Start integration dependencies
        run: docker compose up -d --wait postgres temporal

      - name: Lint and type-check backend
        run: |
          docker run --rm -v "$PWD/backend:/app/backend" -w /app/backend decisionflow-backend ruff check .
          docker run --rm -v "$PWD/backend:/app/backend" -w /app/backend decisionflow-backend mypy src

      - name: Run backend and real-Temporal tests
        run: >-
          docker run --rm --network decisionflow_default
          -e PYTHONPATH=/app/backend/src
          -e TEST_DATABASE_URL=postgresql+psycopg://decisionflow:decisionflow@postgres:5432/decisionflow_test
          -e TEMPORAL_TEST_ADDRESS=temporal:7233
          -v "$PWD/backend:/app/backend"
          -w /app/backend
          decisionflow-backend
          pytest --cov=decisionflow --cov-report=term-missing -q

      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Build deployment images
        run: docker compose build api worker mlflow frontend

      - name: Verify application images run as non-root
        run: |
          test "$(docker image inspect decisionflow-api --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect decisionflow-worker --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect decisionflow-frontend --format '{{.Config.User}}')" = "nginx"

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres temporal

      - name: Clean CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
